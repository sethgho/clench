[workspace]
resolver = "3"
members = ["crates/clench-core", "crates/clench-extract", "crates/clench-cli", "crates/clench-wasm", "crates/clench-ffi"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Apple builds (scripts/build-apple.sh): native code unwinds so UniFFI can
# turn a panic into a Swift error instead of terminating the app.
[profile.apple]
inherits = "release"
opt-level = 3
panic = "unwind"
