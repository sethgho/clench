# XcodeGen spec for the Apple app. Generate the project with
#   xcodegen generate --spec apps/apple/project.yml
# (Clench.xcodeproj is gitignored). See README.md.
name: Clench

options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  ClenchKit:
    path: ClenchKit

targets:
  Clench:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Clench
        excludes: ["*.entitlements"]
    dependencies:
      - package: ClenchKit
        product: ClenchKit
      - target: ClenchShare
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Clench
        PRODUCT_BUNDLE_IDENTIFIER: $(CLENCH_BUNDLE_ID)
        INFOPLIST_FILE: Clench/Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Clench/Clench-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Clench/Clench-macOS$(CLENCH_ENTITLEMENTS_VARIANT).entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  ClenchShare:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ClenchShare
        excludes: ["*.entitlements"]
    dependencies:
      - package: ClenchKit
        product: ClenchKit
    settings:
      base:
        PRODUCT_NAME: ClenchShare
        PRODUCT_BUNDLE_IDENTIFIER: $(CLENCH_SHARE_BUNDLE_ID)
        INFOPLIST_FILE: ClenchShare/Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: ClenchShare/ClenchShare-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ClenchShare/ClenchShare-macOS$(CLENCH_ENTITLEMENTS_VARIANT).entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Clench:
    build:
      targets:
        Clench: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ClenchKit/ClenchKitTests
    archive:
      config: Release
