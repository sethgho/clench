[package]
name = "meatread-cli"
version = "0.1.0"
description = "Command-line tool for fetching, extracting and inspecting meatread documents."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "meatread"
path = "src/main.rs"

[dependencies]
meatread-core = { path = "../meatread-core", features = ["serde"] }
meatread-extract = { path = "../meatread-extract" }
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
serde_json = "1"
