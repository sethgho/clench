[package]
name = "clench-extract"
version = "0.1.0"
description = "Turns web pages, Markdown, plain text and PDFs into clench documents without altering the author's words."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["markdown", "pdf"]
markdown = ["dep:pulldown-cmark"]
pdf = ["dep:pdf-extract"]

[dependencies]
clench-core = { path = "../clench-core" }
dom_smoothie = "=0.20.0"
encoding_rs = "0.8"
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
pdf-extract = { version = "=0.12.1", optional = true }

[dev-dependencies]
clench-core = { path = "../clench-core", features = ["serde"] }
serde_json = "1"
