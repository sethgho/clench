[package]
name = "clench-core"
version = "0.1.0"
description = "Sans-I/O RSVP speed-reading engine: tokenization, pivot alignment, pacing and a host-driven player."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
unicode-segmentation = { version = "1.12", default-features = false }

[dev-dependencies]
serde_json = "1"
