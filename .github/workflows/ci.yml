name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          wasm-tools: "false"
          bun: "false"
          cache-key: rust
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  core-portability:
    name: Core builds (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: thumbv7em
            target: thumbv7em-none-eabihf
            args: ""
          - name: thumbv7em + serde
            target: thumbv7em-none-eabihf
            args: --features serde
          - name: wasm32
            target: wasm32-unknown-unknown
            args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          rust-targets: thumbv7em-none-eabihf
          wasm-tools: "false"
          bun: "false"
          cache-key: core-${{ matrix.target }}
      - run: cargo build -p clench-core --target ${{ matrix.target }} ${{ matrix.args }}

  tui:
    name: Bun (wasm build, TUI tests, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: tui
      - run: bun install --frozen-lockfile
      - run: bun run test

  extension:
    name: Chrome extension (build, browser test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: extension
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run ext:build
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium
      - run: bun run ext:e2e

  apple:
    name: Apple (xcframework, iOS Simulator and macOS builds, Swift tests)
    # Image list: https://github.com/actions/runner-images (Xcode 27 image,
    # arm64). Its default Xcode is 27.1, pinned below.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      XCODEGEN_VERSION: "2.48.0"
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          rust-targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          wasm-tools: "false"
          bun: "false"
          cache-key: apple
      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodebuild -version
      - run: cargo test -p clench-ffi
      - run: sh scripts/build-apple.sh
      # The Swift tests compare word counts with the native tool.
      - run: cargo build -p clench-cli
      - run: xcodegen generate --spec apps/apple/project.yml
      - name: Build Clench for the iOS Simulator
        run: >-
          xcodebuild build -project apps/apple/Clench.xcodeproj -scheme Clench
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO
      - name: Build Clench for macOS
        run: >-
          xcodebuild build -project apps/apple/Clench.xcodeproj -scheme Clench
          -destination 'generic/platform=macOS'
          -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO
      - name: Swift tests (macOS)
        run: >-
          xcodebuild test -project apps/apple/Clench.xcodeproj -scheme Clench
          -destination 'platform=macOS'
          -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO
