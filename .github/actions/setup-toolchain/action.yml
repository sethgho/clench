name: Set up clench toolchain
description: >-
  Installs everything clench builds need on a Linux x64 runner: stable Rust with
  rustfmt, clippy and the wasm32-unknown-unknown target (plus any extra targets,
  e.g. thumbv7em-none-eabihf), a cached wasm-bindgen-cli at exactly the version
  pinned in Cargo.lock, binaryen's wasm-opt, and Bun (only needed to run
  `bun install`; the repo's pinned Bun in node_modules does the rest). Cargo
  and Bun dependency caches are restored and saved automatically. Run it after
  actions/checkout. Each part can be switched off with the inputs below.
inputs:
  rust-targets:
    description: >-
      Extra comma-separated Rust targets to install, in addition to
      wasm32-unknown-unknown (for example thumbv7em-none-eabihf).
    required: false
    default: ""
  wasm-tools:
    description: >-
      Install wasm-bindgen-cli (version read from Cargo.lock) and wasm-opt, which
      scripts/build-wasm.sh needs. "true" or "false".
    required: false
    default: "true"
  bun:
    description: Install Bun and cache its package cache. "true" or "false".
    required: false
    default: "true"
  bun-version:
    description: Bun used to run `bun install` (the repo's pinned Bun is used afterwards).
    required: false
    default: "1.3.14"
  binaryen-version:
    description: Binaryen release number providing wasm-opt.
    required: false
    default: "133"
  cache-key:
    description: Extra suffix for the Rust cache key, to keep jobs with different build flags apart.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown${{ inputs.rust-targets != '' && format(',{0}', inputs.rust-targets) || '' }}

    - name: Cache Cargo dependencies and build output
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}

    - name: Read wasm-bindgen version from Cargo.lock
      if: inputs.wasm-tools == 'true'
      id: wbg
      shell: bash
      run: |
        version=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
        if [ -z "$version" ]; then
          echo "wasm-bindgen not found in Cargo.lock" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache wasm-bindgen-cli
      if: inputs.wasm-tools == 'true'
      id: wbg-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/clench-tools/wasm-bindgen
        key: wasm-bindgen-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.wbg.outputs.version }}

    - name: Install wasm-bindgen-cli
      if: inputs.wasm-tools == 'true'
      shell: bash
      env:
        WBG_VERSION: ${{ steps.wbg.outputs.version }}
        CACHE_HIT: ${{ steps.wbg-cache.outputs.cache-hit }}
      run: |
        dir="$HOME/.cache/clench-tools/wasm-bindgen"
        if [ "$CACHE_HIT" != "true" ]; then
          cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked --root "$dir"
        fi
        echo "$dir/bin" >> "$GITHUB_PATH"

    - name: Cache binaryen
      if: inputs.wasm-tools == 'true'
      id: binaryen-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/clench-tools/binaryen
        key: binaryen-${{ runner.os }}-${{ runner.arch }}-${{ inputs.binaryen-version }}

    - name: Install binaryen (wasm-opt)
      if: inputs.wasm-tools == 'true'
      shell: bash
      env:
        BINARYEN_VERSION: ${{ inputs.binaryen-version }}
        CACHE_HIT: ${{ steps.binaryen-cache.outputs.cache-hit }}
      run: |
        dir="$HOME/.cache/clench-tools/binaryen"
        if [ "$CACHE_HIT" != "true" ]; then
          name="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          base="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}"
          tmp=$(mktemp -d)
          curl -fsSL --retry 3 -o "$tmp/$name" "$base/$name"
          curl -fsSL --retry 3 -o "$tmp/$name.sha256" "$base/$name.sha256"
          (cd "$tmp" && sha256sum -c "$name.sha256")
          mkdir -p "$dir"
          tar -xzf "$tmp/$name" -C "$dir" --strip-components=1
        fi
        echo "$dir/bin" >> "$GITHUB_PATH"

    - name: Install Bun
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun packages
      if: inputs.bun == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-
